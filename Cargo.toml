[package]
name = "pokerforge"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Synchronous byte-oriented Winamax hand-history parsing benchmark"
license = "GPL-3.0-only"
repository = "https://github.com/Bertollo-Nicolas/PokerForge"
publish = false
include = ["src/**", "tests/**", "examples/**", "scripts/**", "benches/**", "README.md", "RELEASING.md", "CHANGELOG.md", "LICENSE", "Cargo.toml", "Cargo.lock"]

[profile.release]
lto = "thin"
codegen-units = 1

[dependencies]
memchr = "2"

[profile.profiling]
inherits = "release"
debug = 2
